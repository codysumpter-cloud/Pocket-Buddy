name: Fix TinyHouse archive root resolution

on:
  push:
    branches:
      - fix/windows-home-art-scale-motion
    paths:
      - .github/workflows/fix-tinyhouse-archive-root.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-home-art-scale-motion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore donor-style ZIP suffix resolution
        shell: python
        run: |
          from pathlib import Path

          path = Path("desktop/canonical-home.mjs")
          text = path.read_text(encoding="utf-8")

          old = '''  const entries = new Map();\n  let cursor = centralOffset;'''
          new = '''  const entries = new Map();\n  const suffixEntries = new Map();\n  let cursor = centralOffset;'''
          if old not in text:
              raise SystemExit("Could not find archive map declaration")
          text = text.replace(old, new, 1)

          old = '''      const key = normalized.toLocaleLowerCase("en-US");\n      if (entries.has(key)) throw new Error(`Private art ZIP has a normalized path collision: ${normalized}`);\n      entries.set(key, { normalized, method, compressedSize, uncompressedSize, localOffset });'''
          new = '''      const key = normalized.toLocaleLowerCase("en-US");\n      if (entries.has(key)) throw new Error(`Private art ZIP has a normalized path collision: ${normalized}`);\n      const record = { normalized, method, compressedSize, uncompressedSize, localOffset };\n      entries.set(key, record);\n\n      // Match the original PocketBuddy+ TinyHouse folder picker: a purchased\n      // archive may be wrapped in one or more parent directories. Index every\n      // safe suffix so requests for `Floor_Wall_Tiles_128/...` resolve inside\n      // `TinyHouse_0.17(@Pixel_Salvaje)/Floor_Wall_Tiles_128/...`. Never use\n      // macOS metadata and never guess when the same suffix is ambiguous.\n      if (!key.startsWith("__macosx/")) {\n        const segments = normalized.split("/");\n        for (let start = 0; start < segments.length; start += 1) {\n          const suffixKey = segments.slice(start).join("/").toLocaleLowerCase("en-US");\n          if (!suffixEntries.has(suffixKey)) suffixEntries.set(suffixKey, record);\n          else if (suffixEntries.get(suffixKey) !== record) suffixEntries.set(suffixKey, null);\n        }\n      }'''
          if old not in text:
              raise SystemExit("Could not find archive entry insertion")
          text = text.replace(old, new, 1)

          old = '''    const normalized = normalizeArchivePath(path);\n    const entry = normalized ? entries.get(normalized.toLocaleLowerCase("en-US")) : null;\n    if (!entry) return null;'''
          new = '''    const normalized = normalizeArchivePath(path);\n    const key = normalized ? normalized.toLocaleLowerCase("en-US") : "";\n    const exact = key ? entries.get(key) : null;\n    const suffix = key ? suffixEntries.get(key) : undefined;\n    if (!exact && suffix === null) throw new Error(`Private art ZIP path is ambiguous: ${normalized}`);\n    const entry = exact ?? suffix ?? null;\n    if (!entry) return null;'''
          if old not in text:
              raise SystemExit("Could not find archive read lookup")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/windows-home-art-scale-motion.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''  assert.match(canonicalHome, /archiveFor/);'''
          addition = '''  assert.match(canonicalHome, /archiveFor/);\n  assert.match(canonicalHome, /suffixEntries/);\n  assert.match(canonicalHome, /segments\\.slice\\(start\\)\\.join/);\n  assert.match(canonicalHome, /Private art ZIP path is ambiguous/);'''
          if marker not in tests:
              raise SystemExit("Could not find canonical Home archive test marker")
          tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate repaired source
        run: |
          node --check desktop/canonical-home.mjs
          node --test tests/windows-home-art-scale-motion.test.mjs
      - name: Remove one-shot workflow and commit fix
        run: |
          rm .github/workflows/fix-tinyhouse-archive-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/canonical-home.mjs tests/windows-home-art-scale-motion.test.mjs .github/workflows/fix-tinyhouse-archive-root.yml
          git commit -m "fix(home): resolve TinyHouse assets through wrapped archive roots"
          git push origin HEAD:fix/windows-home-art-scale-motion
