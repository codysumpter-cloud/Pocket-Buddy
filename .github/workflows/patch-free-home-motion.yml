name: Apply free Home movement patch

on:
  push:
    branches:
      - fix/home-free-movement-presence
    paths:
      - .github/workflows/patch-free-home-motion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-free-movement-presence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared free-movement and presence patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch marker: {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"Missing start marker: {label}")
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f"Missing end marker: {label}")
              return text[:i] + replacement + text[j:]

          movement_block = '''  function desiredHumanVector() {
            const up = keys.has("w") || keys.has("arrowup");
            const down = keys.has("s") || keys.has("arrowdown");
            const left = keys.has("a") || keys.has("arrowleft");
            const right = keys.has("d") || keys.has("arrowright");
            return { x: (right ? 1 : 0) - (left ? 1 : 0), y: (down ? 1 : 0) - (up ? 1 : 0) };
          }

          function applyMotion(actor, result) {
            if (!actor || !result) return false;
            actor.cell = { ...result.position };
            actor.moving = Boolean(result.moved);
            if (result.moved) actor.direction = directionFromWorldDelta(result.dx, result.dy, actor.direction);
            return actor.moving;
          }

          function maybeMoveHuman(_now, dt) {
            if (!human) return;
            if (mode !== "play") {
              human.moving = false;
              return;
            }
            const vector = desiredHumanVector();
            if (!vector.x && !vector.y) {
              human.moving = false;
              return;
            }
            const motion = window.PocketBuddyActorMotion;
            const grid = window.TinyHouseStructure.grid;
            applyMotion(human, motion.moveScreen(grid, human.cell, vector.x, vector.y, dt, HUMAN_SPEED_PX));
          }

          function ensureWanderTarget(actor, now) {
            const motion = window.PocketBuddyActorMotion;
            const grid = window.TinyHouseStructure.grid;
            const reached = actor.target && motion.distancePx(grid, actor.cell, actor.target) <= 7;
            if (!actor.target || reached || now >= actor.targetUntil) {
              actor.target = motion.randomFloorPoint(grid);
              actor.targetUntil = now + 900 + Math.random() * 1900;
            }
            return actor.target;
          }

          function moveAutonomous(actor, now, dt, speed) {
            if (!actor) return;
            const motion = window.PocketBuddyActorMotion;
            const grid = window.TinyHouseStructure.grid;
            const target = ensureWanderTarget(actor, now);
            if (!target) {
              actor.moving = false;
              return;
            }
            const result = motion.moveToward(grid, actor.cell, target, dt, speed, 6);
            applyMotion(actor, result);
            if (!result.moved && !result.reached) {
              actor.target = null;
              actor.targetUntil = 0;
            }
          }

          function maybeMoveBuddy(now, dt) {
            if (!buddy) return;
            const motion = window.PocketBuddyActorMotion;
            const grid = window.TinyHouseStructure.grid;
            if (mode === "play" && human) {
              buddy.target = null;
              const distance = motion.distancePx(grid, buddy.cell, human.cell);
              if (distance > 72) {
                const result = motion.moveToward(grid, buddy.cell, human.cell, dt, BUDDY_SPEED_PX, 62);
                applyMotion(buddy, result);
              } else {
                buddy.moving = false;
              }
              return;
            }
            moveAutonomous(buddy, now, dt, BUDDY_IDLE_SPEED_PX);
          }

          function maybeMoveIdleHuman(now, dt) {
            if (!human || mode !== "idle") return;
            moveAutonomous(human, now, dt, HUMAN_IDLE_SPEED_PX);
          }

'''

          # Pet runtime: Home owns the single visible Buddy presence.
          path = Path("src/buddy/pet-runtime.js")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, '  let rootListenersInstalled = false;\n', '  let rootListenersInstalled = false;\n  let homeActive = false;\n', 'pet runtime home state')
          marker = '''  function uiScaleMultiplier() {
            return cssNumber(shadowRoot, "--birb-ui-scale", 1);
          }
'''
          replacement = marker + '''
          function syncPresence() {
            if (!base) return;
            base.style.pointerEvents = homeActive ? "none" : "";
            if (homeActive) {
              base.style.opacity = "0";
              if (overlay) overlay.style.display = "none";
              if (heart) heart.style.display = "none";
              return;
            }
            if (active) {
              base.style.opacity = "0";
              if (overlay) overlay.style.display = "block";
            } else {
              base.style.opacity = "";
              if (overlay) overlay.style.display = "none";
            }
          }
'''
          text = replace_once(text, marker, replacement, 'pet runtime sync presence')
          text = replace_once(text, '    if (!active) return;\n', '    if (!active || homeActive) return;\n', 'heart hidden in Home')
          old_select = '''  async function select(id) {
            lastCenter = null;
            if (id === "pocket-bird" || !id) {
              active = null;
              if (base) base.style.opacity = "";
              if (overlay) overlay.style.display = "none";
              if (heart) heart.style.display = "none";
              return;
            }
            active = await library.loadRuntime(id);
            if (!active) {
              if (base) base.style.opacity = "";
              if (overlay) overlay.style.display = "none";
              return;
            }
            ensureOverlay();
            overlay.style.display = "block";
            if (base) base.style.opacity = "0";
            if (active.pack.source === "openpets") void imageFor(active, active.pack.sheetPath, "image/webp");
          }
'''
          new_select = '''  async function select(id) {
            lastCenter = null;
            if (id === "pocket-bird" || !id) {
              active = null;
              if (heart) heart.style.display = "none";
              syncPresence();
              return;
            }
            active = await library.loadRuntime(id);
            if (!active) {
              syncPresence();
              return;
            }
            ensureOverlay();
            syncPresence();
            if (active.pack.source === "openpets") void imageFor(active, active.pack.sheetPath, "image/webp");
          }
'''
          text = replace_once(text, old_select, new_select, 'pet select presence')
          text = replace_once(text, '  function drawOverlay(now) {\n    if (!active || !base || !overlay || !overlayCtx) return;\n', '  function drawOverlay(now) {\n    if (homeActive || !active || !base || !overlay || !overlayCtx) return;\n', 'overlay hidden in Home')
          text = replace_once(text, '    uiScaleMultiplier,\n    drawRuntime,\n', '    uiScaleMultiplier,\n    setHomeActive(value) {\n      homeActive = Boolean(value);\n      syncPresence();\n    },\n    isHomeActive() { return homeActive; },\n    drawRuntime,\n', 'expose Home presence')
          text = replace_once(text, '      if (base) base.style.opacity = "";\n', '      if (base) { base.style.opacity = ""; base.style.pointerEvents = ""; }\n', 'restore pointer events')
          path.write_text(text, encoding="utf-8")

          # Desktop and web actor bridges share continuous sub-cell movement.
          for filename, desktop in [
              ("desktop/pocket-buddy-home-actors.js", True),
              ("desktop/tinyhouse-home/pocket-buddy-web-actors.js", False),
          ]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = replace_once(text, '  const MOVE_MS = 180;\n', '  const HUMAN_SPEED_PX = 155;\n  const HUMAN_IDLE_SPEED_PX = 92;\n  const BUDDY_SPEED_PX = 112;\n  const BUDDY_IDLE_SPEED_PX = 82;\n', f'{filename} speeds')
              if desktop:
                  text = replace_once(text, '  const keys = new Set();\n', '  const keys = new Set();\n  window.addEventListener("keydown", (event) => {\n    if (event.key !== "Escape") return;\n    event.preventDefault();\n    event.stopPropagation();\n    keys.clear();\n    bridge?.close?.();\n  }, true);\n', 'desktop early Escape')
              else:
                  text = replace_once(text, '  const keys = new Set();\n', '  const keys = new Set();\n  window.addEventListener("keydown", (event) => {\n    if (event.key !== "Escape") return;\n    event.preventDefault();\n    event.stopPropagation();\n    keys.clear();\n    buddyApi.home?.close?.();\n  }, true);\n', 'web early Escape')
                  text = replace_once(text, '  let lastIdleMove = 0;\n', '  let lastIdleMove = 0;\n  let lastFrameAt = performance.now();\n', 'web frame time')
              text = replace_once(text, '      moving: false,\n      moveStartedAt: 0,\n', '      moving: false,\n      moveStartedAt: 0,\n      target: null,\n      targetUntil: 0,\n', f'{filename} targets')
              text = replace_between(text, '  function startMove(actor, target, now = performance.now()) {', '  function renderActor(actor, now) {', movement_block + '  function renderActor(actor, now) {', f'{filename} movement block')
              if desktop:
                  text = replace_once(text, '    const point = actorPosition(actor, now);\n', '    const point = worldPoint(actor.cell);\n', 'desktop direct actor point') if '    const point = actorPosition(actor, now);\n' in text else text
                  old_loop = '''  function loop(now) {
            const dt = Math.min(50, now - lastFrameAt);
            lastFrameAt = now;
            void dt;
            maybeMoveHuman(now);
            maybeMoveIdleHuman(now);
            maybeMoveBuddy(now);
            renderActor(human, now);
            renderActor(buddy, now);
            requestAnimationFrame(loop);
          }
'''
              else:
                  text = replace_once(text, '    const point = actorPoint(actor, now);\n', '    const point = worldPoint(actor.cell);\n', 'web direct actor point') if '    const point = actorPoint(actor, now);\n' in text else text
                  old_loop = '''  function loop(now) {
            maybeMoveHuman(now);
            maybeMoveBuddy(now);
            maybeMoveIdleHuman(now);
            renderActor(human, now);
            renderActor(buddy, now);
            requestAnimationFrame(loop);
          }
'''
              new_loop = '''  function loop(now) {
            const dt = Math.min(0.05, Math.max(0, (now - lastFrameAt) / 1000));
            lastFrameAt = now;
            maybeMoveHuman(now, dt);
            maybeMoveBuddy(now, dt);
            maybeMoveIdleHuman(now, dt);
            renderActor(human, now);
            renderActor(buddy, now);
            requestAnimationFrame(loop);
          }
'''
              text = replace_once(text, old_loop, new_loop, f'{filename} continuous loop')
              path.write_text(text, encoding="utf-8")

          # Native Home close (including the Windows X button) restores the desktop Buddy.
          path = Path("desktop/canonical-home.mjs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text,
              'export function createCanonicalHomeManager({ getWorkArea, getArtEntries, readArtBytes }) {',
              'export function createCanonicalHomeManager({ getWorkArea, getArtEntries, readArtBytes, onClosed = () => {} }) {',
              'canonical Home close callback')
          text = replace_once(text,
              '      homeWindow.on("closed", () => { homeWindow = null; });',
              '      homeWindow.on("closed", () => { homeWindow = null; onClosed(); });',
              'canonical Home closed event')
          path.write_text(text, encoding="utf-8")

          path = Path("desktop/main.mjs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text,
              '    readArtBytes: readBundledArt,\n  });',
              '    readArtBytes: readBundledArt,\n    onClosed: () => overlayWindow?.webContents.send("pocket-buddy:home-closed"),\n  });',
              'main Home closed IPC')
          path.write_text(text, encoding="utf-8")

      - name: Validate patched runtime
        run: |
          node --check src/buddy/pet-runtime.js
          node --check src/buddy/home.js
          node --check desktop/main.mjs
          node --check desktop/preload.cjs
          node --check desktop/canonical-home.mjs
          node --check desktop/pocket-buddy-home-actors.js
          node --check desktop/tinyhouse-home/actor-motion-core.js
          node --check desktop/tinyhouse-home/pocket-buddy-web-actors.js
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-free-home-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/buddy/pet-runtime.js desktop/pocket-buddy-home-actors.js desktop/tinyhouse-home/pocket-buddy-web-actors.js desktop/canonical-home.mjs desktop/main.mjs .github/workflows/patch-free-home-motion.yml
          git commit -m "fix(home): free actor movement and single Buddy presence"
          git push origin HEAD:fix/home-free-movement-presence
