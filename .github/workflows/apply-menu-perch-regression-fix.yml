name: Apply Pocket Buddy menu and perch regression fix

on:
  push:
    branches:
      - fix/restore-guide-wardrobe-perch-flight
    paths:
      - .github/workflows/apply-menu-perch-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-guide-wardrobe-perch-flight
      - name: Restore base tools and animated perch arrival
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          layer_path = Path('src/buddy/layer.js')
          layer = layer_path.read_text()

          old_scan = '''    let settingsItem = null;
    let hideItem = null;
    for (const item of originalItems.slice(1)) {
      const label = item.textContent?.trim() ?? "";
      if (label === "Settings") settingsItem = item;
      if (/^Hide (Bird|Birb)$/i.test(label)) {
        item.textContent = "Hide Buddy";
        hideItem = item;
      }
    }
'''
          new_scan = '''    let fieldGuideItem = null;
    let wardrobeItem = null;
    let stickyNoteItem = null;
    let settingsItem = null;
    let hideItem = null;
    const extraBaseItems = [];
    for (const item of originalItems.slice(1)) {
      const label = item.textContent?.trim() ?? "";
      if (label === "Field Guide") {
        fieldGuideItem = item;
        continue;
      }
      if (label === "Wardrobe") {
        wardrobeItem = item;
        continue;
      }
      if (label === "Sticky Note") {
        stickyNoteItem = item;
        continue;
      }
      if (label === "Settings") {
        settingsItem = item;
        continue;
      }
      if (/^Hide (Bird|Birb)$/i.test(label)) {
        item.textContent = "Hide Buddy";
        hideItem = item;
        continue;
      }
      // Preserve optional/debug/link-back rows instead of silently deleting base features.
      extraBaseItems.push(item);
    }
'''
          if layer.count(old_scan) != 1:
              raise SystemExit(f'Expected original menu scan once, found {layer.count(old_scan)}')
          layer = layer.replace(old_scan, new_scan)

          old_root = '''    const leanRoot = [first, homeItem, chillItem, buddyItem, myPetsItem, menuSeparator(), settingsItem, hideItem, quitItem].filter(Boolean);
'''
          new_root = '''    const baseTools = [fieldGuideItem, wardrobeItem, stickyNoteItem, settingsItem, hideItem].filter(Boolean);
    const leanRoot = [
      first,
      homeItem,
      chillItem,
      buddyItem,
      myPetsItem,
      menuSeparator(),
      ...baseTools,
      ...(extraBaseItems.length ? [menuSeparator(), ...extraBaseItems] : []),
      quitItem,
    ].filter(Boolean);
'''
          if layer.count(old_root) != 1:
              raise SystemExit(f'Expected leanRoot once, found {layer.count(old_root)}')
          layer = layer.replace(old_root, new_root)
          layer_path.write_text(layer)

          app_path = Path('src/application.js')
          app = app_path.read_text()

          old_timing = 'const HOP_DELAY = 500;\n'
          new_timing = 'const HOP_DELAY = 500;\nconst MIN_PERCH_DWELL = 1000 * 12; // Let a landing breathe before choosing another perch.\n'
          if app.count(old_timing) != 1:
              raise SystemExit(f'Expected HOP_DELAY once, found {app.count(old_timing)}')
          app = app.replace(old_timing, new_timing)

          old_switch = '''\t\t\t\t} else if (Math.random() < FOCUS_SWITCH_CHANCE) {
\t\t\t\t\t// Fly to another element if idle for a longer while
\t\t\t\t\tflyToElement();
'''
          new_switch = '''\t\t\t\t} else if (Date.now() - stateStart > MIN_PERCH_DWELL && Math.random() < FOCUS_SWITCH_CHANCE) {
\t\t\t\t\t// Fly to another element only after Buddy has had time to enjoy this perch.
\t\t\t\t\tflyToElement();
'''
          if app.count(old_switch) != 1:
              raise SystemExit(f'Expected focus-switch block once, found {app.count(old_switch)}')
          app = app.replace(old_switch, new_switch)

          old_initial = '\t\tflyToElement(true);\n'
          new_initial = '''\t\t// Website-aware perches make an initial teleport very noticeable. Enter the first
\t\t// perch through the same curved FLYING path used for every later landing.
\t\tflyToElement();
'''
          if app.count(old_initial) != 1:
              raise SystemExit(f'Expected initial teleport once, found {app.count(old_initial)}')
          app = app.replace(old_initial, new_initial)
          app_path.write_text(app)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          cat >> tests/menu-stability.test.mjs <<'EOF'

          test("Pocket Buddy main menu preserves Field Guide, Wardrobe, and base utility actions", () => {
            const source = read("src/buddy/layer.js");
            assert.match(source, /label === "Field Guide"/);
            assert.match(source, /label === "Wardrobe"/);
            assert.match(source, /const baseTools = \[fieldGuideItem, wardrobeItem, stickyNoteItem, settingsItem, hideItem\]/);
            assert.match(source, /extraBaseItems\.push\(item\)/);
            assert.match(source, /\.\.\.baseTools/);
          });
          EOF

          cat > tests/perch-flight.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const source = readFileSync(new URL("../src/application.js", import.meta.url), "utf8");

          test("initial website-aware perch arrival uses the existing flying path instead of teleporting", () => {
            assert.doesNotMatch(source, /flyToElement\(true\)/);
            assert.match(source, /Enter the first[\s\S]*curved FLYING path[\s\S]*flyToElement\(\);/);
            assert.match(source, /function flyTo\(x, y\)[\s\S]*setState\(States\.FLYING\)[\s\S]*Animations\.FLYING/);
            assert.match(source, /updateParabolicPath\(FLY_SPEED, 2\)/);
          });

          test("Buddy dwells on a perch before random focus switching", () => {
            assert.match(source, /const MIN_PERCH_DWELL = 1000 \* 12/);
            assert.match(source, /Date\.now\(\) - stateStart > MIN_PERCH_DWELL && Math\.random\(\) < FOCUS_SWITCH_CHANCE/);
          });
          EOF

      - name: Commit source and tests
        shell: bash
        run: |
          git add src/application.js src/buddy/layer.js tests/menu-stability.test.mjs tests/perch-flight.test.mjs
          if git diff --cached --quiet; then
            echo "Regression patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore Pocket Buddy tools and animated perch arrivals"
          git push origin HEAD:fix/restore-guide-wardrobe-perch-flight
